# Ships the Rust executor as a Python wheel, so users get the binary from
# `pip install` without a Rust toolchain — the pattern uv and ruff use.
#
# This is a separate distribution from `agentgauge` on purpose. The Python
# package must stay installable with no Rust anywhere (an sdist build, a
# platform with no wheel, a contributor who does not want the toolchain), and
# it falls back to the in-process Docker executor when no binary is found.
#
# maturin installs the binary into the environment's scripts directory, which
# is on PATH, which is where agentgauge/sandbox/discovery.py already looks.
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "agentgauge-executord"
description = "Sandbox executor binary for AgentGauge"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Intended Audience :: Developers",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/anmol0b/AgentGauge"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
