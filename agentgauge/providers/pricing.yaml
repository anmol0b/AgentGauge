# USD per 1M tokens. Matched by longest model-id prefix, so dated snapshots
# (claude-sonnet-5-20260101) resolve to their base entry.
#
# A model that is not listed here has NO price — cost is reported as unknown
# rather than estimated from a default. A benchmark that prints a confident
# dollar figure derived from the wrong model's rate is worse than one that
# admits it does not know.
#
# cache_write / cache_read default to 1.25x and 0.10x of input when omitted,
# which are the standard Anthropic prompt-caching multipliers (5m TTL).
#
# Anthropic rates verified 2026-06-24, Google 2026-10-19. Verify before
# trusting a cost total:
# https://www.anthropic.com/pricing  |  https://openai.com/api/pricing/
# https://ai.google.dev/gemini-api/docs/pricing

anthropic:
  claude-fable-5-1:   {input: 10.0, output: 50.0, cache_read: 0.25}
  claude-fable-5:     {input: 10.0, output: 50.0}
  claude-opus-5:      {input: 5.0,  output: 25.0}
  claude-opus-4-8:    {input: 5.0,  output: 25.0}
  claude-opus-4-7:    {input: 5.0,  output: 25.0}
  claude-opus-4-6:    {input: 5.0,  output: 25.0}
  claude-opus-4-1:    {input: 15.0, output: 75.0}
  claude-sonnet-5:    {input: 2.0,  output: 10.0}
  claude-sonnet-4-6:  {input: 3.0,  output: 15.0}
  claude-sonnet-4-5:  {input: 3.0,  output: 15.0}
  claude-haiku-4-5:   {input: 1.0,  output: 5.0}

# Cached input is stated per model: OpenAI's discount is not Anthropic's
# 0.10x default, and differs between models. Verified 2026-10-21.
openai:
  gpt-4.1:      {input: 2.0,  output: 8.0,  cache_read: 0.50}
  gpt-4o-mini:  {input: 0.15, output: 0.60, cache_read: 0.075}
  gpt-4o:       {input: 2.5,  output: 10.0, cache_read: 1.25}

# Paid-tier rates. A free-tier key is not charged, but the figure is still
# what the same run would cost on a paid key. Output includes thinking.
# gemini-3.5-flash is absent because Google publishes no price for it.
# 3.6/3.8 Flash double on 2027-01-01 (input 1.50, output 7.50, cache 0.15).
google:
  gemini-3.8-flash:      {input: 0.75, output: 3.75, cache_read: 0.075}
  gemini-3.6-flash:      {input: 0.75, output: 3.75, cache_read: 0.075}
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50, cache_read: 0.03}

# Local models cost nothing to run. Listed explicitly so "free" is a recorded
# fact rather than a missing price.
local:
  ollama/: {input: 0.0, output: 0.0}
