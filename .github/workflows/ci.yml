name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # The Docker-marked test needs a daemon and the sandbox image; the rest
      # of the suite is offline and needs no API keys, so it gates every push.
      - run: pytest tests/ -m "not docker" -q
