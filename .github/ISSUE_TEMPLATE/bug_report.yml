name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything exploitable, please open a
        [private security advisory](https://github.com/anmol0b/PersonaFit/security/advisories/new)
        instead. See `docs/SECURITY.md`.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true

  - type: dropdown
    id: executor
    attributes:
      label: Executor
      description: Both satisfy the same contract, so a difference between them is itself a bug worth reporting.
      options: ["python", "rust", "both", "not sure"]
    validations:
      required: true

  - type: dropdown
    id: reproduces_with_python
    attributes:
      label: Does it reproduce with `--executor python`?
      description: This narrows it to the Rust executor or the shared logic faster than anything else.
      options: ["yes", "no", "have not tried"]
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command you ran, and the task file if it is not `example.yaml`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Output of: `agentbench --version; python -V; docker --version; uname -sm`"
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Useful when relevant: the run's `stop_reason`, whether the run errored or
        failed, executor logs (`AGENTBENCH_LOG=debug`), the report row.
